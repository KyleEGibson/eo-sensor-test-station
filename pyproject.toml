[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-sensor-test-station"
version = "1.0.0"
description = "Automated test station and requirements traceability for a simulated electro-optical sensor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyle Gibson" }]
dependencies = [
    "pyserial>=3.5",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points.pytest11]
rtm = "pytest_rtm.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p test_station.plugin -p pytester --junitxml=reports/junit.xml"
rtm_requirements = "requirements/requirements.yaml"
rtm_output = "reports"
markers = [
    "system: system-level tests that exercise several subsystems together",
]
