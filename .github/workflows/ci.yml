name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run acceptance suite with strict traceability
        run: pytest --rtm-strict --operator github-actions
      - name: Publish RTM summary
        if: always()
        shell: bash
        run: cat reports/rtm.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/

  fault-campaign:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/fault_campaign.py
      - name: Publish campaign summary
        if: always()
        run: cat docs/fault_campaign.md >> "$GITHUB_STEP_SUMMARY"

  pages:
    # Publishes the latest test report and RTM. Enable once in the repo:
    # Settings -> Pages -> Source: GitHub Actions.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --rtm-strict --operator github-actions
      - name: Assemble site
        run: |
          mkdir site
          cp reports/test_report.html site/index.html
          cp reports/rtm.html reports/rtm.xlsx reports/rtm.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
